spring.application.name=minori_backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/minori
spring.datasource.username=minori_app
spring.datasource.password=minori_app
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true