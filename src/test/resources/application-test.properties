
spring.application.name=minori_backend_test

# PostgreSQL - Testes
spring.datasource.url=jdbc:postgresql://localhost:5432/minori_test
spring.datasource.username=minori_test_app
spring.datasource.password=minori_test_app
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
